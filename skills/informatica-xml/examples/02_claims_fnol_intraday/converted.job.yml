# wf_CLAIMS_FNOL_INTRADAY -> Lakeflow Job. Shapes cited from databricks-jobs references/triggers-schedules.md
# "Cron Schedules" (quartz_cron_expression, timezone_id, pause_status) and references/task-types.md "SQL Task".
#
# Legacy schedule owner: Control-M ALB-CLM-0107 (orchestration/controlm/ALBION_CLAIMS_INTRADAY.xml), every 30 minutes
# 06:00-22:00 Europe/London. The workflow itself has no Informatica scheduler. Nothing in cron claims this job, so
# there is a single owner (contrast example 01).
resources:
  jobs:
    wf_claims_fnol_intraday:
      name: "wf_CLAIMS_FNOL_INTRADAY"
      max_concurrent_runs: 1                    # Control-M cyclic job does not overlap itself
      schedule:
        quartz_cron_expression: "0 0/30 6-21 ? * *"   # Quartz has a seconds field; Control-M/cron do not (SKILL.md section 6)
        timezone_id: "Europe/London"
        pause_status: PAUSED                    # unpause only after the parallel-run recon signs off (D5)
      tasks:
        # Procedure definition and procedure execution are separate tasks: converted.sql only (re)defines the
        # procedure, so a run whose only task was that file would report success without loading a single claim.
        # The deploy task is idempotent (CREATE OR REPLACE) and may be moved to bundle deployment; the CALL task is
        # the unit that must run on every schedule tick.
        - task_key: deploy_m_CLAIMS_FNOL_INTRADAY
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./converted.sql             # CREATE OR REPLACE PROCEDURE only
              source: WORKSPACE
          max_retries: 0
        - task_key: s_m_CLAIMS_FNOL_INTRADAY
          depends_on:
            - task_key: deploy_m_CLAIMS_FNOL_INTRADAY
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./converted.call.sql        # DECLARE + CALL with the resolved table names + SELECT rows_loaded
              source: WORKSPACE
          max_retries: 0                        # no session Recovery Strategy in the export -> no retry
