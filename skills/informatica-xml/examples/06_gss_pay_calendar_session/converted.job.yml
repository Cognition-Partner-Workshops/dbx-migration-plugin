# wf_Pay_Calendar -> Lakeflow Job (shapes: databricks-jobs references/task-types.md "Run SQL File"; databricks-dbsql
# references/sql-scripting.md "CALL (Invoke a Procedure)" for converted.call.sql;
# references/dependencies-control-flow.md `depends_on` + `run_if`, references/notifications-monitoring.md
# "Email Notifications"; databricks-dabs bundle-structure.md for ${var.*}).
#
# Legacy DAG (WORKFLOWLINK rows, all conditions `$<session>.Status = Succeeded`):
#   Start -> s_Reset -> s_Set -> s_Verify -> s_Build_Message -> Email_Pay_Calendar
# SCHEDULEINFO SCHEDULETYPE="ONDEMAND": no schedule; the workflow is started by an external caller (SKILL.md
# section 2 "Scheduler edges": look for it in Control-M / cron / pmcmd wrappers - none found in the fixture for this
# GSS workflow, recorded as an INFERRED manual start).
#
# Session-level settings and their job-level equivalents (SKILL.md section 6):
#   Recovery Strategy "Fail task and continue workflow"  -> max_retries: 0; downstream run_if ALL_SUCCESS means the
#                                                           chain stops at the failure exactly as the link condition did
#   Failure Email session component (on_failure_mail)     -> task email_notifications.on_failure
#   Pre/post-session variable assignment components       -> the OUT parameter of the procedure (TgtSuccessRows);
#                                                           promoted to a task value only if s_Build_Message reads it
#   Commit Interval / Commit Type / Rollback on Errors    -> no equivalent needed (single atomic MERGE, see converted.sql)
#   $$WF_PAY_CALENDAR_EMAIL_LIST, $$WF_SUBJECT, $$WF_MESSAGE -> bundle variables (names only; values live in the
#                                                           parameter file / Build_Message session, not in this repo)
resources:
  jobs:
    wf_pay_calendar:
      name: "wf_Pay_Calendar"
      max_concurrent_runs: 1
      # ONDEMAND: no `schedule:` block by design.
      email_notifications:
        # Email_Pay_Calendar (last task of the legacy DAG, link `$s_Pay_Calendar_Build_Message.Status = Succeeded`):
        # fires only when the whole chain succeeded = job-level on_success (databricks-jobs
        # references/notifications-monitoring.md "Email Notifications" `on_success`). Subject/body are run metadata,
        # not the computed $$WF_SUBJECT / $$WF_MESSAGE text (see the note under s_Pay_Calendar_Build_Message).
        on_success:
          - ${var.wf_pay_calendar_email_list}      # $$WF_PAY_CALENDAR_EMAIL_LIST = Email_Pay_Calendar recipients
        # on_failure_mail session component (Failure Email on every session): a separate recipient list in the
        # legacy, kept separate here; the fixture uses the same variable for both.
        on_failure:
          - ${var.wf_pay_calendar_email_list}
      tasks:
        # Definition and execution are separate tasks: converted.sql only (re)defines the procedure; a run made of that
        # file alone would succeed without touching PAY_PERIOD. The CALL (converted.call.sql) is the session.
        - task_key: deploy_s_Pay_Calendar_Reset_Pay_Calendar
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./converted.sql                 # CREATE OR REPLACE PROCEDURE only (idempotent)
              source: WORKSPACE
          max_retries: 0
        - task_key: s_Pay_Calendar_Reset_Pay_Calendar
          depends_on:
            - task_key: deploy_s_Pay_Calendar_Reset_Pay_Calendar
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./converted.call.sql            # DECLARE + CALL + SELECT tgt_success_rows
              source: WORKSPACE
          max_retries: 0
        - task_key: s_Pay_Calendar_Set_Pay_Calendar       # elided in the source excerpt; shape only
          depends_on:
            - task_key: s_Pay_Calendar_Reset_Pay_Calendar
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./s_pay_calendar_set_pay_calendar.sql   # not included
              source: WORKSPACE
          max_retries: 0
        - task_key: s_Pay_Calendar_Verify_Pay_Calendar    # elided in the source excerpt; shape only
          depends_on:
            - task_key: s_Pay_Calendar_Set_Pay_Calendar
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./s_pay_calendar_verify_pay_calendar.sql  # not included
              source: WORKSPACE
          max_retries: 0
        - task_key: s_Pay_Calendar_Build_Message          # elided in the source excerpt; shape only
          depends_on:
            - task_key: s_Pay_Calendar_Verify_Pay_Calendar
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./s_pay_calendar_build_message.sql   # not included; sets $$WF_SUBJECT / $$WF_MESSAGE
              source: WORKSPACE
          max_retries: 0
        # Email_Pay_Calendar (Email task with $$WF_SUBJECT / $$WF_MESSAGE bodies) is converted as the job-level
        # `email_notifications.on_success` above: same recipients, same "only after Build_Message succeeded" semantics,
        # but the mail carries run metadata, not the computed body. If the computed "Current Pay Period" text is a
        # hard requirement (D5, ask the GSS payroll team), add a final task here that reads the TgtSuccessRows /
        # WF_SUBJECT / WF_MESSAGE task values from s_Pay_Calendar_Build_Message and sends the mail (notebook or
        # python task with the SMTP secret referenced by NAME); it must depend on s_Pay_Calendar_Build_Message with
        # run_if ALL_SUCCESS so failure mail and success mail stay separate.
