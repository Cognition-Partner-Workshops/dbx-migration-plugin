# Converted under skills/tsql-ssis/SKILL.md §6 "isql shell runner / cron" and §2b "Scheduler edges".
# Shape and field names per databricks-jobs SKILL.md and references/task-types.md (sql_task query/file,
# depends_on, run_if), references/triggers-schedules.md (quartz_cron_expression, timezone_id, pause_status),
# references/notifications-monitoring.md (email_notifications, timeout_seconds, max_retries).
# Deploy through a Databricks Asset Bundle (databricks-core / target-routing); this is the resource block.
#
# Source: batch/run_nightly_batch.sh, cron `0 2 * * *`, three sequential isql steps, each `exit 1` on failure
# (so step N+1 runs only if step N succeeded). Credentials came from ${SYBASE_PWD} in the shell
# environment: they do not carry over; the job runs as its run_as principal against the warehouse.

resources:
  jobs:
    loan_servicing_nightly_batch:
      name: loan_servicing_nightly_batch
      description: "Converted from batch/run_nightly_batch.sh (cron 0 2 * * *)."
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"      # 02:00 daily; the source box's TZ is recorded below
        timezone_id: "America/New_York"            # FROM .migration/00_context.md; cron had no TZ of its own
        pause_status: PAUSED                        # unpause at cutover only
      timeout_seconds: 10800
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: "${var.migration_catalog}"
        - name: schema
          default: "loan_servicing"
      email_notifications:
        on_failure:
          - "${var.batch_oncall_alias}"             # replaces `>> nightly.log` + manual log review
      tasks:
        # Step 1: EXEC dbo.sp_nightly_accrual @processing_date = GETDATE()
        - task_key: sp_nightly_accrual
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/sp_nightly_accrual_call.sql
              # body: DECLARE rc INT; CALL IDENTIFIER(:catalog || '.' || :schema || '.sp_nightly_accrual')(current_timestamp(), rc);
              source: WORKSPACE
          max_retries: 0                              # the shell did not retry; keep parity until recon signs off
          timeout_seconds: 3600

        # Step 2: EXEC dbo.sp_apply_late_fees @cutoff_date = GETDATE()   (shell: only if step 1 exit 0)
        - task_key: sp_apply_late_fees
          depends_on:
            - task_key: sp_nightly_accrual
          run_if: ALL_SUCCESS                         # `if ! isql ...; then exit 1` == ALL_SUCCESS
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/sp_apply_late_fees_call.sql   # CALL ...sp_apply_late_fees(current_timestamp(), rc)
              source: WORKSPACE
          timeout_seconds: 1800

        # Step 3: EXEC dbo.sp_end_of_day_reconciliation  (shell: only if steps 1 and 2 exit 0)
        - task_key: sp_end_of_day_reconciliation
          depends_on:
            - task_key: sp_apply_late_fees
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/sp_end_of_day_reconciliation_call.sql
              source: WORKSPACE
          timeout_seconds: 1800

        # The shell's "FAILED: ... CHECK RECON RESULTS" echo becomes a cleanup/notify task
        # that runs only when something upstream failed.
        - task_key: nightly_batch_failed
          depends_on:
            - task_key: sp_nightly_accrual
            - task_key: sp_apply_late_fees
            - task_key: sp_end_of_day_reconciliation
          run_if: AT_LEAST_ONE_FAILED
          sql_task:
            warehouse_id: "${var.warehouse_id}"
            file:
              path: ../sql/nightly_batch_failed_audit.sql   # INSERT INTO audit_trail ('BATCH_FAILED', ...)
              source: WORKSPACE

# GETDATE() at each step in the source was evaluated per isql session (three slightly different
# timestamps). current_timestamp() per task keeps the same semantics; a single job-level run date
# passed as a job parameter ({{job.parameters.processing_date}}) would be a behavior change and
# needs a tolerance-record entry.
