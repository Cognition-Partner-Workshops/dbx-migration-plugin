# Converted under skills/tsql-ssis/SKILL.md §6 "SSIS control flow" rows.
# Lakeflow Jobs resource (Databricks Asset Bundle shape) per databricks-jobs SKILL.md "Multi-Task
# Workflows" (depends_on / run_if / job parameters), references/task-types.md ("SQL Task": sql_task.file
# with source: WORKSPACE + warehouse_id), references/notifications-monitoring.md (on_failure), and
# https://docs.databricks.com/aws/en/jobs/conditional-tasks (Run if semantics: AT_LEAST_ONE_FAILED tasks
# are Excluded when unmet; Excluded cascades along linear chains), /aws/en/jobs/parameter-use (SQL tasks
# read key-value parameters as :name; job parameters are pushed down to SQL tasks) and
# /aws/en/jobs/dynamic-value-references ({{job.run_id}}; {{tasks.<task_name>.result_state}} with values success /
# failed / excluded / ...; {{tasks.<task_name>.error_code}}, empty string for successful tasks), /aws/en/jobs/if-else and /aws/en/jobs/task-values
# (If/else condition task on {{tasks.<task>.values.<key>}}; task values are set from Python notebooks with
# dbutils.jobs.taskValues.set), and the condition_task / depends_on.outcome YAML shape from
# /aws/en/dev-tools/bundles/resources (job example: condition_task op/left/right, depends_on outcome: 'true').
#
# Mapping from source.dtsx:
#   SQL Count eligible (SingleRow -> EligibleCount)  ->  notebook task count_eligible setting task value eligible_count.
#   Expression constraint @[User::EligibleCount] > 0 ->  If/else task check_eligible (GREATER_THAN); accrual depends on
#                                                      outcome 'true'. When false, accrual is Excluded and the exclusion
#                                                      cascades to fees and EOD, exactly like the unmet SSIS constraint.
#   Success constraints (LogicalAnd)            ->  depends_on + run_if: ALL_SUCCESS (default).
#   Failure constraints, LogicalAnd="False"     ->  one task (log_failure, BATCH_FAILED row) with the three proc tasks
#                                                  as depends_on + run_if: AT_LEAST_ONE_FAILED.
#   FailPackageOnFailure="True"                 ->  default: any failed task fails the run.
#   OnError event handler (SSIS_ONERROR row)    ->  a SEPARATE task (on_error_audit) with the same run_if over every
#                                                  task in the package, because the handler is package-wide and its
#                                                  row is a distinct audit_trail event the source writes in addition
#                                                  to BATCH_FAILED. The on_failure notification is an extra signal,
#                                                  it does not replace either row.
#   $Project::ServerName connection manager     ->  catalog/schema job parameters (no server name survives).
#   $Package::ServicerId (7) / User::ProcessingDate ((DT_DBDATE)GETDATE()) -> job parameters; ProcessingDate
#     is evaluated inside SQL as current_date() so the job does not need a runtime-expression variable.
resources:
  jobs:
    nightly_servicing:
      name: nightly_servicing        # NightlyServicing.dtsx
      description: "Converted from NightlyServicing.dtsx (SQL Server / SQL Agent edition of batch/run_nightly_batch.sh)"
      max_concurrent_runs: 1         # SSIS packages are not re-entrant; SQL Agent skips overlapping schedules
      timeout_seconds: 7200
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: servicer_id
          default: "7"               # $Package::ServicerId default value
      email_notifications:
        on_failure:
          - ${var.ops_email}
      tasks:
        # SQL Count eligible with ResultSet=SingleRow bound to @[User::EligibleCount].
        # A SQL task cannot publish a task value (task values are set only from Python notebooks:
        # docs /jobs/task-values), so the count runs in a small notebook:
        #   n = spark.sql(f"SELECT count(*) FROM {catalog}.{schema}.loans "
        #                 "WHERE loan_status = 'AC' AND servicer_id = :sid", args={"sid": int(servicer_id)}).first()[0]
        #   dbutils.jobs.taskValues.set(key="eligible_count", value=n)
        # (catalog/schema/servicer_id arrive as base_parameters; job parameters are pushed down: /jobs/parameter-use).
        - task_key: count_eligible
          notebook_task:
            notebook_path: ../src/count_eligible_loans.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              servicer_id: "{{job.parameters.servicer_id}}"

        # Precedence constraint Count eligible -> Nightly accrual: Success AND @[User::EligibleCount] > 0
        # (EvalOp=3 ExpressionAndConstraint). The expression becomes a graph-visible If/else task: accrual
        # depends on the 'true' outcome, so on a zero count accrual never runs and the fees -> EOD Success
        # chain behind it never fires either (dependents run "based on the results of the condition",
        # docs /jobs/if-else; skipped tasks cascade: docs /jobs/conditional-tasks "If all of a task's
        # dependencies are excluded, the task itself is also excluded"). Folding the guard into accrual's
        # SQL (IF eligible_count > 0 THEN CALL ...) is NOT equivalent: that task would succeed having done
        # nothing and the downstream Success edges would still fire. Live check: confirm the skipped tasks'
        # result_state (EXCLUDED per the Jobs API run schema) on the first zero-count run.
        - task_key: check_eligible
          depends_on:
            - task_key: count_eligible
          condition_task:
            op: GREATER_THAN                # numeric comparison (docs /jobs/if-else)
            left: "{{tasks.count_eligible.values.eligible_count}}"
            right: "0"

        # SQL Nightly accrual: runs only on the 'true' outcome (depends_on.outcome, docs bundles/resources).
        #   USE CATALOG IDENTIFIER(:catalog); USE SCHEMA IDENTIFIER(:schema);
        #   CALL sp_nightly_accrual(current_date());
        # (databricks-dbsql references/sql-scripting.md "CALL"; IDENTIFIER clause is allowed for USE
        #  CATALOG/SCHEMA and table names, not for CALL targets: docs sql-ref-names-identifier-clause.)
        # Job parameters (catalog, schema, servicer_id) are pushed down automatically and read as :name.
        - task_key: nightly_accrual
          depends_on:
            - task_key: check_eligible
              outcome: "true"
          sql_task:
            file:
              path: ../sql/sp_nightly_accrual_call.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Accrual -> Fees : Success, LogicalAnd
        - task_key: apply_late_fees
          depends_on:
            - task_key: nightly_accrual
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: ../sql/sp_apply_late_fees_call.sql     # CALL ...sp_apply_late_fees(current_date())
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Fees -> EOD : Success, LogicalAnd
        - task_key: eod_reconciliation
          depends_on:
            - task_key: apply_late_fees
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: ../sql/sp_end_of_day_reconciliation_call.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Three Failure constraints with LogicalAnd="False" (OR) into SQL Log failure: one task,
        # AT_LEAST_ONE_FAILED over the three procedure tasks exactly as the constraints are drawn. Excluded
        # (not failed) when the run is clean, and skipped on a zero-count run too (no dependency failed;
        # skipped upstreams count as success for run_if: docs /jobs/conditional-tasks).
        # Delta from SSIS: "Upstream tasks marked Upstream failed ... are treated as failed" (same page), so
        # when count_eligible itself fails the three proc tasks are Upstream failed and this task RUNS,
        # whereas the SSIS Failure constraints never fired (their source tasks never executed). The SQL
        # therefore inserts only when one of the three procs' own result_state is 'failed'; otherwise it
        # writes nothing and only on_error_audit below records the run, as in the source.
        # The source binds ? to User::EligibleCount (record_count column): the task value is passed in
        # (try_cast: an unset task value arrives as the literal reference string, docs dynamic-value-references
        # "non-existent dynamic reference values ... are ... treated as literal strings").
        - task_key: log_failure
          depends_on:
            - task_key: nightly_accrual
            - task_key: apply_late_fees
            - task_key: eod_reconciliation
          run_if: AT_LEAST_ONE_FAILED
          sql_task:
            file:
              path: ../sql/log_batch_failure.sql
              # INSERT INTO IDENTIFIER(:catalog||'.'||:schema||'.audit_trail')
              #   (action_type, action_date, table_name, record_count, new_value)
              # SELECT 'BATCH_FAILED', current_timestamp(), 'loans', try_cast(:eligible_count AS INT),
              #        'NightlyServicing.dtsx run ' || :run_id
              # WHERE 'failed' IN (:s_accr, :s_fees, :s_eod);
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            parameters:
              run_id: "{{job.run_id}}"      # task-level key-value parameter, read as :run_id
              eligible_count: "{{tasks.count_eligible.values.eligible_count}}"
              s_accr: "{{tasks.nightly_accrual.result_state}}"
              s_fees: "{{tasks.apply_late_fees.result_state}}"
              s_eod:  "{{tasks.eod_reconciliation.result_state}}"

        # Package-scope OnError event handler: INSERT INTO dbo.audit_trail (action_type, action_date,
        # table_name, new_value) VALUES ('SSIS_ONERROR', GETDATE(), System::SourceName, System::ErrorDescription).
        # A distinct audit event the source writes for ANY error in the package (Count eligible and the
        # expression evaluation included, and Log failure itself), so it fans in on every task with
        # AT_LEAST_ONE_FAILED; Excluded on a clean run, so clean-run semantics are unchanged.
        #   table_name (System::SourceName)      -> the failed task key(s), derived from each task's result_state
        #   new_value  (System::ErrorDescription) -> the non-empty error_code(s) plus the run id; the full message
        #                                            is on the run page, keyed by the run id.
        # SSIS fires the handler once per error event (a failing task usually raises more than one), so the
        # source can leave several SSIS_ONERROR rows per failed run; the conversion writes exactly one
        # (recorded delta, NOTE.md). Recon on failure-injection runs compares presence per run, not count.
        - task_key: on_error_audit
          depends_on:
            - task_key: count_eligible
            # no `outcome`: fan-in on completion of the If/else itself, so a failed evaluation
            # (e.g. a non-numeric task value) is audited like any other task failure
            - task_key: check_eligible
            - task_key: nightly_accrual
            - task_key: apply_late_fees
            - task_key: eod_reconciliation
            - task_key: log_failure
          run_if: AT_LEAST_ONE_FAILED
          sql_task:
            file:
              path: ../sql/log_ssis_onerror.sql
              # INSERT INTO IDENTIFIER(:catalog||'.'||:schema||'.audit_trail')
              #   (action_type, action_date, table_name, new_value)
              # VALUES ('SSIS_ONERROR', current_timestamp(),
              #         concat_ws(',', CASE WHEN :s_count = 'failed' THEN 'count_eligible' END,
              #                        CASE WHEN :s_check = 'failed' THEN 'check_eligible' END,
              #                        CASE WHEN :s_accr  = 'failed' THEN 'nightly_accrual' END,
              #                        CASE WHEN :s_fees  = 'failed' THEN 'apply_late_fees' END,
              #                        CASE WHEN :s_eod   = 'failed' THEN 'eod_reconciliation' END,
              #                        CASE WHEN :s_log   = 'failed' THEN 'log_failure' END),
              #         concat_ws(' ', nullif(:e_count, ''), nullif(:e_check, ''), nullif(:e_accr, ''),
              #                        nullif(:e_fees, ''), nullif(:e_eod, ''), nullif(:e_log, ''),
              #                        'run ' || :run_id));
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
            parameters:
              run_id:  "{{job.run_id}}"
              s_count: "{{tasks.count_eligible.result_state}}"
              s_check: "{{tasks.check_eligible.result_state}}"
              s_accr:  "{{tasks.nightly_accrual.result_state}}"
              s_fees:  "{{tasks.apply_late_fees.result_state}}"
              s_eod:   "{{tasks.eod_reconciliation.result_state}}"
              s_log:   "{{tasks.log_failure.result_state}}"
              e_count: "{{tasks.count_eligible.error_code}}"
              e_check: "{{tasks.check_eligible.error_code}}"
              e_accr:  "{{tasks.nightly_accrual.error_code}}"
              e_fees:  "{{tasks.apply_late_fees.error_code}}"
              e_eod:   "{{tasks.eod_reconciliation.error_code}}"
              e_log:   "{{tasks.log_failure.error_code}}"

# Not represented (SKILL §6 "SSIS Checkpoints"): the package had no CheckpointFileName, so no repair-run
# note. ProtectionLevel=EncryptSensitiveWithUserKey is a §9 governance finding: the package can only be
# opened by its author's Windows profile, so the .dtsx on disk is authoritative for structure but any
# sensitive property values it carried are unreadable (recorded, never recovered).
